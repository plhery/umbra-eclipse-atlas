name: Feature request
description: Suggest a focused improvement to the eclipse-planning experience.
title: "Idea: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the person, place, or field situation—not only the proposed control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Explain how the idea would fit the existing journey.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Fit
      options:
        - label: This keeps the map useful on a small touchscreen.
        - label: I searched existing issues for a similar idea.
          required: true
